name: Platform builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libxtst6 libgbm1 libasound2t64 libnotify4
      - run: npm ci --no-audit --no-fund
      - name: Verify source checkout is clean
        run: git status --short
      - name: Tests, lint, typecheck, production UI, native packages, source, checksums
        run: npm run release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BIHON_EXECUTABLE = Join-Path $PWD 'dist/win-unpacked/Bihon.exe'
          npm run verify:packaged
      - name: Install and test Linux Debian package with the normal sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y ./dist/*.deb
          BIHON_EXECUTABLE=/opt/Bihon/bihon xvfb-run -a npm run verify:packaged
          mv artifacts/packaged-linux artifacts/packaged-linux-deb
      - name: Test shipped Linux AppImage in the isolated runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x dist/*.AppImage
          mkdir -p .build/appimage
          cd .build/appimage
          ../../dist/*.AppImage --appimage-extract >/dev/null
          cd ../..
          if grep -q -- '--no-sandbox' .build/appimage/squashfs-root/*.desktop; then exit 1; fi
          for library in libjcef.so libcef.so; do
            report=$(ldd ".build/appimage/squashfs-root/resources/runtime/kcef/$library")
            echo "$report"
            if echo "$report" | grep -q 'not found'; then exit 1; fi
          done
          BIHON_EXECUTABLE="$PWD/.build/appimage/squashfs-root/bihon" BIHON_SMOKE_NO_SANDBOX=1 xvfb-run -a npm run verify:packaged
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ runner.os }}
          path: artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*source.zip
            dist/*.md
            dist/LICENSE
            dist/UPSTREAM.json
          if-no-files-found: error

  android:
    name: Android APK and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # PR and routine CI code only ever use disposable test signing.
      BIHON_ANDROID_RELEASE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Fetch and verify pinned Mihon; apply Bihon changes
        run: node scripts/android-prepare.cjs
      - name: Install pinned Android SDK and NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "ndk;29.0.14206865"'
      - name: Unit tests, database migration checks, and universal APK
        working-directory: .build/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest verifySqlDelightMigration assembleRelease -Pdist=foss -Pinclude-telemetry=false -Penable-updater=false
      - name: Collect and verify test APK
        run: node scripts/android-collect.cjs --test-build
      - name: Corresponding Android source
        run: node scripts/android-source.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-evidence
          path: |
            .build/android/**/build/reports/
            .build/android/**/build/test-results/
            .build/android/app/build/outputs/apk/release/app-universal-release.apk
            artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.apk.json
            dist/*source.tar.gz
          if-no-files-found: error

  android-smoke:
    name: Android emulator (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: Start isolated emulator
        env:
          API: ${{ matrix.api }}
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64" platform-tools emulator
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name bihon-ci --package "system-images;android-$API;google_apis;x86_64" --force
          mkdir -p artifacts/android-smoke
          nohup "$ANDROID_HOME/emulator/emulator" -avd bihon-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect >artifacts/android-smoke/emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install, launch, and check for crashes
        run: node scripts/android-smoke.cjs dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-api-${{ matrix.api }}
          path: artifacts/
          if-no-files-found: error
