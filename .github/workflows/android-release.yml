name: Signed Android package

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign:
    # Signing material belongs only in this release environment, never in
    # repository-level secrets available to same-repository pull requests.
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful platform validation for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$GITHUB_SHA" --event push --status success --limit 1 --json headSha > "$RUNNER_TEMP/validated.json"
          node -e "const runs=require(process.env.RUNNER_TEMP+'/validated.json'); if(runs.length!==1 || runs[0].headSha!==process.env.GITHUB_SHA) throw Error('Run all platform checks successfully for this exact main commit first')"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned native source and toolchain
        run: |
          node scripts/android-prepare.cjs
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'ndk;29.0.14206865'
      - name: Decode authorized release key
        env:
          KEYSTORE_BASE64: ${{ secrets.BIHON_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bihon-signing"
          node -e "if(!process.env.KEYSTORE_BASE64) throw Error('Configure the authorized signing key in the android-release environment'); require('fs').writeFileSync(process.env.RUNNER_TEMP+'/bihon-signing/bihon.jks', Buffer.from(process.env.KEYSTORE_BASE64,'base64'), {mode:0o600})"
      - name: Build signed universal APK
        working-directory: .build/android
        env:
          BIHON_ANDROID_RELEASE: 'true'
          BIHON_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bihon-signing/bihon.jks
          BIHON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BIHON_ANDROID_KEYSTORE_PASSWORD }}
          BIHON_ANDROID_KEY_ALIAS: ${{ secrets.BIHON_ANDROID_KEY_ALIAS }}
          BIHON_ANDROID_KEY_PASSWORD: ${{ secrets.BIHON_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease -Pdist=foss -Pinclude-telemetry=false -Penable-updater=false
      - name: Verify production identity and archive complete source
        run: |
          node scripts/android-collect.cjs --certificate-sha256 "$(cat android/signing-certificate.sha256)"
          node scripts/android-source.cjs
          node scripts/release-checksums.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android
          path: |
            dist/*.apk
            dist/*.apk.json
            dist/*source.tar.gz
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Remove ephemeral key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/bihon-signing/bihon.jks"
